<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VEXitEY Tagwatch</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm">
      <h1>Tagwatch</h1>
      <p>Dashboard password</p>
      <input type="password" id="password" autocomplete="current-password" required />
      <button type="submit">Open</button>
      <p id="loginErr" class="err"></p>
    </form>
  </div>

  <main id="app" class="hidden">
    <header>
      <div>
        <h1>Tagwatch</h1>
        <p class="sub">@vexitey · browser ingest · Sept 13–15 drawing window</p>
      </div>
      <div id="stats" class="stats"></div>
    </header>

    <section>
      <h2>Eligible entries</h2>
      <div id="eligible" class="grid"></div>
    </section>

    <section>
      <h2>Recent tags</h2>
      <div id="tags" class="grid"></div>
    </section>

    <section>
      <h2>Followers on file</h2>
      <div id="followers" class="table"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
