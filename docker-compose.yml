services:
  igtracker:
    build: .
    ports:
      - "3000:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-changeme}
      INGEST_API_KEY: ${INGEST_API_KEY:-dev-ingest-key}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GIVEAWAY_WINDOW_START: "2026-09-13"
      GIVEAWAY_WINDOW_END: "2026-09-15"
      TZ: America/Chicago
      DATA_DIR: /data
    volumes:
      - igtracker-data:/data
    restart: unless-stopped
volumes:
  igtracker-data:
